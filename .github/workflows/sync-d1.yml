name: 🔄 Sync GitHub to D1 [DISABLED]
# ⚠️  DISABLED: D1 is now the single source of truth.
# The daily-add.yml workflow writes directly to D1 and js/data.js no longer exists.
# This workflow silently skips every run. Keeping file for historical reference.
# To re-enable, remove the 'if: false' guard on the sync job below.

on:
  workflow_dispatch: # Manual trigger only — all schedule triggers removed

jobs:
  sync:
    if: false # DISABLED — see header comment above
    name: Sync data.js to Cloudflare D1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check if data.js exists
        id: check_file
        run: |
          if [ -f "js/data.js" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ js/data.js not found. D1 is the source of truth. Skipping sync."
          fi

      - name: Set up Node.js
        if: steps.check_file.outputs.exists == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Generate SQL Scripts
        if: steps.check_file.outputs.exists == 'true'
        run: node scripts/generate-sql.js

      - name: Execute SQL on Cloudflare D1
        if: steps.check_file.outputs.exists == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Loop through all generated insert files and execute them
          node scripts/d1-exec-file.mjs insert_*.sql
          echo "✅ Successfully synced data.js to D1!"
