name: 🩺 Daily Deadlink Checker

on:
  schedule:
    # Runs every day at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  deadlink-check:
    name: Check & Remove Dead Links
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Fetch existing sites from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "==== Fetching existing URLs from D1 ===="
          # Query all IDs and URLs from D1 and save to a JSON file
          npx wrangler d1 execute hv-directory --remote \
            --command="SELECT id, url FROM sites;" \
            --json > /tmp/d1_sites_raw.json 2>/dev/null || echo '[]' > /tmp/d1_sites_raw.json

          # Extract just the result array
          node -e "
            const raw = require('/tmp/d1_sites_raw.json');
            const rows = Array.isArray(raw) && raw[0] && raw[0].results ? raw[0].results : [];
            require('fs').writeFileSync('/tmp/d1_sites.json', JSON.stringify(rows));
            console.log('Existing sites loaded: ' + rows.length);
          "

      - name: Run Deadlink Checker
        run: |
          echo "==== CHECKING FOR DEAD LINKS ===="
          node scripts/daily-deadlink-checker.js \
            --existing-urls /tmp/d1_sites.json \
            --output-sql /tmp/deadlinks.sql

      - name: Remove dead sites from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -f /tmp/deadlinks.sql ] && [ -s /tmp/deadlinks.sql ]; then
            echo "==== Deleting dead sites from D1 ===="
            node scripts/d1-exec-file.mjs /tmp/deadlinks.sql
            echo "==== D1 cleanup complete ===="
          else
            echo "No dead links found to delete."
          fi
