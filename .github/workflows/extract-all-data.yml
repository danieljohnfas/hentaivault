name: 💾 Extract All Analytics Data

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install googleapis --no-audit --no-fund
      - name: Run Extraction
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/extract-all-data.js
      # The repository is public: raw GSC/Cloudflare exports are kept as a
      # short-lived workflow artifact instead of being committed.
      - name: Upload raw data
        uses: actions/upload-artifact@v7
        with:
          name: raw-analytics-data
          path: reports/raw-data/
          retention-days: 14
