name: 🛠️ Ops (one-off production tasks)

# Runs the tasks listed in ops/tasks.json (see scripts/ops/run.js).
# Logs are public: tasks print status codes and IDs only.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'ops/tasks.json'

permissions:
  contents: read

concurrency:
  group: ops
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund googleapis
      - name: Run tasks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/ops/run.js
