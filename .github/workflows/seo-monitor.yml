name: 🤖 SEO Auto-Monitor & Auto-Fix

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (diagnose only, no commits or deploys)'
        required: false
        default: 'false'
        type: boolean
      force_deploy:
        description: 'Force deploy even if no fixes were applied'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  seo-monitor:
    name: SEO Monitor & Auto-Fix
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 0. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # ── 1. Setup ─────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Configure Git identity
        run: |
          git config user.name "HentaiVault SEO Bot"
          git config user.email "seo-bot@hentaivault.me"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # ── 2. Run SEO auto-fix engine ──────────────────────────────────────────
      - name: Run SEO Auto-Fix Engine
        id: seo_fix
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          SITE_URL: sc-domain:hentaivault.me
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          node scripts/seo-autofix.js $DRY_RUN_FLAG
          echo "exit_code=$?" >> $GITHUB_OUTPUT

          # Only website files trigger a deploy; report-only changes are just committed.
          CHANGED=$(git status --porcelain -- index.html blog/ | wc -l)
          echo "files_changed=$CHANGED" >> $GITHUB_OUTPUT
          echo "::notice::SEO auto-fix complete. Site files changed: $CHANGED"

      # ── 3. Show report in Actions log ───────────────────────────────────────
      - name: Display SEO Status Report
        if: always()
        run: |
          if [ -f "reports/seo-status.md" ]; then
            echo "════════════════════════════════════════"
            cat reports/seo-status.md
            echo "════════════════════════════════════════"
          else
            echo "No report file generated (dry run or error)."
          fi

      # ── 4. Commit fixes to GitHub ────────────────────────────────────────────
      - name: Commit fixes & report to GitHub
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          # Stage only what the bot is allowed to touch (never `git add -A`: that is
          # how node_modules and scratch files ended up in this repository).
          git add reports/ index.html blog/ .gitignore

          # Only commit if something changed
          if git diff --cached --quiet; then
            echo "✅ No changes to commit — everything is already optimal."
          else
            DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "🤖 seo-bot: auto-fixes & status report [$DATE]

          Generated by seo-monitor workflow.
          See reports/seo-status.md for full details."
            git push
            echo "commit_pushed=true" >> $GITHUB_OUTPUT
          fi

      # ── 5. Validate & deploy to Cloudflare ─────────────────────────────────
      - name: Validate worker bundle
        if: ${{ github.event.inputs.dry_run != 'true' && (steps.seo_fix.outputs.files_changed != '0' || github.event.inputs.force_deploy == 'true') }}
        run: |
          node --check src/index.js
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/worker-dist

      - name: Deploy to Cloudflare Workers
        if: ${{ github.event.inputs.dry_run != 'true' && (steps.seo_fix.outputs.files_changed != '0' || github.event.inputs.force_deploy == 'true') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      # (Google and Bing retired their sitemap "ping" endpoints; sitemaps are
      #  discovered from robots.txt and Search Console instead.)

      # ── 7. Summary ───────────────────────────────────────────────────────────
      - name: Final summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🤖 HentaiVault SEO Monitor Run Complete"
          echo "📅 $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "📄 Report: https://github.com/${{ github.repository }}/blob/main/reports/seo-status.md"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
