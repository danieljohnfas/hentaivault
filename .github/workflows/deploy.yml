name: 🚀 Deploy Worker

# Deploys the Worker + static assets whenever site code changes on main.
# The bundle is validated first so a syntax error never reaches production.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'reports/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'bot/**'
      - '**.md'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate
        run: |
          node --check src/index.js
          node --check js/app.js
          node --test 'scripts/test/*.test.mjs'
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/worker-dist

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Smoke test
        run: |
          sleep 10
          fail=0
          for path in "/" "/robots.txt" "/sitemap.xml" "/blog/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://hentaivault.me$path")
            echo "$path -> $code"
            case "$code" in 200|403) ;; *) fail=1 ;; esac   # 403 = Cloudflare bot challenge for CI IPs
          done
          exit $fail
